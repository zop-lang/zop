[package]
name = "zop"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "The last systems language you'll ever need"
license = "Apache-2.0"
repository = "https://github.com/zop-lang/zop"
readme = "README.md"

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dependencies]
cranelift-codegen = "=0.134.3"
cranelift-frontend = "=0.134.3"
cranelift-jit = "=0.134.3"
cranelift-module = "=0.134.3"
cranelift-native = "=0.134.3"
cranelift-object = "=0.134.3"
logos = "=0.16.1"
melior = "=0.27.4"
ryu-js = "=1.0.3"

[dev-dependencies]
naga = { version = "=30.0.0", features = ["wgsl-in"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.3"

[[bin]]
name = "zop"
path = "src/main.rs"

# The profile used for cargo-dist release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
