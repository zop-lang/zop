[package]
name = "zop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
cranelift-codegen = "=0.134.3"
cranelift-frontend = "=0.134.3"
cranelift-jit = "=0.134.3"
cranelift-module = "=0.134.3"
cranelift-native = "=0.134.3"
cranelift-object = "=0.134.3"
logos = "=0.16.1"
melior = "=0.27.4"
ryu-js = "=1.0.3"

[dev-dependencies]
naga = { version = "=30.0.0", features = ["wgsl-in"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.3"

[[bin]]
name = "zop"
path = "src/main.rs"
