- name: Install LLVM 22
  shell: bash
  run: brew install llvm

- name: Configure LLVM 22
  shell: bash
  run: |
    llvm_prefix="$(brew --prefix llvm)"
    llvm_major="$($llvm_prefix/bin/llvm-config --version | cut -d. -f1)"
    test "$llvm_major" = "22"
    echo "LLVM_CONFIG_PATH=$llvm_prefix/bin/llvm-config" >> "$GITHUB_ENV"
    echo "MLIR_SYS_220_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
    echo "TABLEGEN_220_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
