[workspace]
members = ["cargo:."]

# cargo-dist is the only release packager. This file is the source for the
# generated .github/workflows/release.yml workflow.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
dispatch-releases = true
fail-fast = true
github-attestations = true
github-attestations-phase = "announce"
github-build-setup = "../../release/build-setup.yml"
github-custom-job-permissions = { release-gate = { contents = "read", issues = "read" } }
hosting = "github"
install-path = "CARGO_HOME"
installers = ["shell"]
include = ["NOTICE"]
plan-jobs = ["./release-gate"]
pr-run-mode = "plan"
source-tarball = true
targets = ["aarch64-apple-darwin"]

[dist.github-custom-runners]
global = "ubuntu-24.04"

[dist.github-action-commits]
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
