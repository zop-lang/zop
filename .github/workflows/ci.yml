name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler and contracts
    runs-on: macos-14
    env:
      MLIR_SYS_LINK_SHARED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install LLVM 22
        run: brew install llvm

      - name: Configure LLVM 22
        run: |
          llvm_prefix="$(brew --prefix llvm)"
          llvm_major="$($llvm_prefix/bin/llvm-config --version | cut -d. -f1)"
          test "$llvm_major" = "22"
          echo "LLVM_CONFIG_PATH=$llvm_prefix/bin/llvm-config" >> "$GITHUB_ENV"
          echo "MLIR_SYS_220_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "TABLEGEN_220_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --no-self-update
          rustup default 1.95.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test compiler
        run: cargo test --locked --all-targets

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Check web conformance
        run: tools/conformance/check-web.sh

      - name: Test release gate
        run: tools/release/test-check-milestone.sh
